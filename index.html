      function renderIdeas() {
        return `<div class="view"><div class="workspace-intro"><div><h2>把灵感先放到桌面上</h2><p>不要求一次成稿。题目、钩子、角度和证据，先分别留下可继续工作的线索。</p></div><span class="tag lilac">${state.ideas.length} 条记录</span></div><div class="split-layout"><section class="panel form-panel" aria-labelledby="idea-form-title"><div class="panel-header"><div><h2 id="idea-form-title">新增选题</h2><p>先捕捉，再筛选</p></div><span data-icon="spark" aria-hidden="true"></span></div><div class="panel-body"><div class="field"><label for="idea-topic">选题名称</label><input id="idea-topic" type="text" placeholder="例如：一个事件，为什么值得被解释"></div><div class="field"><label for="idea-hook">开头 / 钩子</label><textarea id="idea-hook" placeholder="第一句想让谁停下来？"></textarea></div><div class="field"><label for="idea-angle">核心角度</label><textarea id="idea-angle" placeholder="你准备从哪一个具体问题切进去？"></textarea></div><div class="field"><label for="idea-evidence">证据线索 <small>可选</small></label><input id="idea-evidence" type="text" placeholder="链接、文件名或待查来源"></div><div class="field"><label for="idea-format">内容形态</label><select id="idea-format"><option value="短视频">短视频</option><option value="图文">图文</option><option value="长文">长文</option><option value="待定">待定</option></select></div><div class="form-actions"><button class="button button-primary" id="save-idea" type="button">${icon('plus', 16)}保存选题</button></div></div></section><section class="panel capture-panel" aria-labelledby="idea-list-title"><div class="panel-header"><div><h2 id="idea-list-title">灵感清单</h2><p>只显示你自己留下的记录</p></div></div><div class="panel-body">${state.ideas.length ? `<div class="record-list">${state.ideas.map(renderIdea).join('')}</div>` : renderEmpty('spark', '这里还没有选题', '想到一个就先记下来。没有真实内容时，空白比虚构更有用。')}</div></section></div></div>`;
      }
      function renderIdea(item) {
        return `<article class="record" data-record-id="${escapeHTML(item.id)}"><div class="record-top"><div><h3 class="record-title">${escapeHTML(item.topic)}</h3><div class="record-meta"><span class="tag lilac">${escapeHTML(item.format || '待定')}</span><span>${escapeHTML(formatShortDate(item.createdAt || today))}</span></div></div><button class="icon-button delete-record" type="button" data-kind="ideas" data-id="${escapeHTML(item.id)}" title="删除这条选题" aria-label="删除这条选题">${icon('trash', 17)}</button></div><div class="record-content">${item.hook ? `<p><strong>开头</strong> ${escapeHTML(item.hook)}</p>` : ''}${item.angle ? `<p><strong>角度</strong> ${escapeHTML(item.angle)}</p>` : ''}${item.evidence ? `<p><strong>证据</strong> ${escapeHTML(item.evidence)}</p>` : ''}</div><div class="record-actions"><label class="sr-only" for="idea-status-${escapeHTML(item.id)}">选题状态</label><select id="idea-status-${escapeHTML(item.id)}" class="record-status" data-kind="ideas" data-id="${escapeHTML(item.id)}"><option ${item.status === '草稿' ? 'selected' : ''}>草稿</option><option ${item.status === '候选' ? 'selected' : ''}>候选</option><option ${item.status === '已发布' ? 'selected' : ''}>已发布</option></select><span class="tag ${item.status === '已发布' ? '' : 'yellow'}">${escapeHTML(item.status || '草稿')}</span></div></article>`;
      }

      function renderRemix() {
        return `<div class="view"><div class="workspace-intro"><div><h2>把“为什么有效”拆出来</h2><p>这里记录参考视频的结构，不自动抓取榜单，也不把别人的表现写成你的结果。</p></div><span class="tag yellow">${state.remixes.length} 条记录</span></div><div class="split-layout"><section class="panel form-panel" aria-labelledby="remix-form-title"><div class="panel-header"><div><h2 id="remix-form-title">新增参考</h2><p>拆结构，不抄结论</p></div><span data-icon="play" aria-hidden="true"></span></div><div class="panel-body"><div class="field"><label for="remix-title">视频标题 / 主题</label><input id="remix-title" type="text" placeholder="你实际看到的标题或主题"></div><div class="field"><label for="remix-source">来源链接 <small>可选</small></label><input id="remix-source" type="url" placeholder="https://"></div><div class="field"><label for="remix-platform">平台</label><select id="remix-platform"><option value="抖音">抖音</option><option value="小红书">小红书</option><option value="视频号">视频号</option><option value="B站">B站</option><option value="其他">其他</option></select></div><div class="field"><label for="remix-reason">你判断它有效的原因</label><textarea id="remix-reason" placeholder="是开头、节奏、冲突、信息密度，还是评论区问题？"></textarea></div><div class="field"><label for="remix-structure">可复用结构</label><textarea id="remix-structure" placeholder="用自己的话写成 3–5 步"></textarea></div><div class="field"><label for="remix-angle">你的原创角度</label><textarea id="remix-angle" placeholder="同一结构，你准备换成什么内容？"></textarea></div><div class="form-actions"><button class="button button-primary" id="save-remix" type="button">${icon('plus', 16)}保存参考</button></div></div></section><section class="panel capture-panel" aria-labelledby="remix-list-title"><div class="panel-header"><div><h2 id="remix-list-title">参考档案</h2><p>先有真实链接和观察，再谈复用</p></div></div><div class="panel-body">${state.remixes.length ? `<div class="record-list">${state.remixes.map(renderRemixRecord).join('')}</div>` : renderEmpty('play', '还没有参考档案', '看完一条视频后，把你真正观察到的结构写下来。')}</div></section></div></div>`;
      }
      function renderRemixRecord(item) {
        const source = safeExternalURL(item.source);
        return `<article class="record" data-record-id="${escapeHTML(item.id)}"><div class="record-top"><div><h3 class="record-title">${escapeHTML(item.title)}</h3><div class="record-meta"><span class="tag yellow">${escapeHTML(item.platform || '其他')}</span><span>${escapeHTML(formatShortDate(item.createdAt || today))}</span></div></div><button class="icon-button delete-record" type="button" data-kind="remixes" data-id="${escapeHTML(item.id)}" title="删除这条参考" aria-label="删除这条参考">${icon('trash', 17)}</button></div><div class="record-content">${item.reason ? `<p><strong>有效原因</strong> ${escapeHTML(item.reason)}</p>` : ''}${item.structure ? `<p><strong>可复用结构</strong> ${escapeHTML(item.structure)}</p>` : ''}${item.angle ? `<p><strong>原创角度</strong> ${escapeHTML(item.angle)}</p>` : ''}${source ? `<p><strong>来源</strong> <a href="${escapeHTML(source)}" target="_blank" rel="noopener noreferrer">打开链接 ${icon('arrow', 13)}</a></p>` : item.source ? '<p><strong>来源</strong> 链接格式不受支持</p>' : ''}</div><div class="record-actions"><label class="sr-only" for="remix-status-${escapeHTML(item.id)}">参考状态</label><select id="remix-status-${escapeHTML(item.id)}" class="record-status" data-kind="remixes" data-id="${escapeHTML(item.id)}"><option ${item.status === '待拆解' ? 'selected' : ''}>待拆解</option><option ${item.status === '已拆解' ? 'selected' : ''}>已拆解</option><option ${item.status === '已转化' ? 'selected' : ''}>已转化</option></select><span class="tag ${item.status === '已转化' ? '' : 'yellow'}">${escapeHTML(item.status || '待拆解')}</span></div></article>`;
      }

      function renderReview() {
        return `<div class="view"><div class="workspace-intro"><div><h2>把一次发布变成下一次判断</h2><p>只填真实发生过的数据。没有数据时，先写观察和下一步，不用用漂亮数字装饰空白。</p></div><span class="tag lilac">${state.reviews.length} 次复盘</span></div><div class="review-layout"><section class="panel review-form" aria-labelledby="review-form-title"><div class="panel-header"><div><h2 id="review-form-title">新增复盘</h2><p>数字可选，问题必答</p></div><span data-icon="chart" aria-hidden="true"></span></div><div class="panel-body"><div class="field"><label for="review-title">内容标题</label><input id="review-title" type="text" placeholder="这次发布的标题"></div><div class="metric-grid"><div class="field"><label for="review-views">播放 / 阅读量 <small>真实数据</small></label><input id="review-views" type="number" min="0" inputmode="numeric" placeholder="可留空"></div><div class="field"><label for="review-likes">点赞 / 收藏</label><input id="review-likes" type="number" min="0" inputmode="numeric" placeholder="可留空"></div><div class="field"><label for="review-comments">评论</label><input id="review-comments" type="number" min="0" inputmode="numeric" placeholder="可留空"></div><div class="field"><label for="review-shares">转发</label><input id="review-shares" type="number" min="0" inputmode="numeric" placeholder="可留空"></div></div><div class="metric-preview"><div class="metric-cell"><span>互动率</span><strong id="preview-engagement">—</strong></div><div class="metric-cell"><span>数据状态</span><strong id="preview-status">待填</strong></div></div><div class="field"><label for="review-opening">开头发生了什么</label><textarea id="review-opening" placeholder="哪一句让人继续看，哪一句太慢？"></textarea></div><div class="field"><label for="review-structure">结构 / 节奏</label><textarea id="review-structure" placeholder="信息顺序、转折、画面或口播节奏"></textarea></div><div class="field"><label for="review-lesson">下一次只改一件事</label><textarea id="review-lesson" placeholder="写一个可执行的改动"></textarea></div><div class="form-actions"><button class="button button-primary" id="save-review" type="button">${icon('refresh', 16)}保存复盘</button></div></div></section><section class="panel review-list-panel" aria-labelledby="review-list-title"><div class="panel-header"><div><h2 id="review-list-title">复盘记录</h2><p>让结论回到下一次创作</p></div></div><div class="panel-body">${state.reviews.length ? `<div class="record-list">${state.reviews.map(renderReviewRecord).join('')}</div>` : renderEmpty('refresh', '还没有复盘记录', '发布一次之后，回来写下真实观察。数据可以晚一点补，判断先留下。')}</div></section></div></div>`;
      }
      function renderReviewRecord(item) {
        const hasViews = Number.isFinite(item.views) && item.views > 0;
        const totalActions = (item.likes || 0) + (item.comments || 0) + (item.shares || 0);
        const engagement = hasViews ? `${(totalActions / item.views * 100).toFixed(1)}%` : '—';
        return `<article class="record review-record"><div class="record-top"><div><h3 class="record-title">${escapeHTML(item.title)}</h3><div class="record-meta"><span>${escapeHTML(formatShortDate(item.createdAt || today))}</span>${hasViews ? `<span class="tag">已录入数据</span>` : '<span class="tag yellow">待补数据</span>'}</div></div><button class="icon-button delete-record" type="button" data-kind="reviews" data-id="${escapeHTML(item.id)}" title="删除这条复盘" aria-label="删除这条复盘">${icon('trash', 17)}</button></div><div class="review-metrics"><div class="review-metric"><span>播放 / 阅读</span><strong>${hasViews ? item.views.toLocaleString('zh-CN') : '—'}</strong></div><div class="review-metric"><span>点赞 / 收藏</span><strong>${item.likes || '—'}</strong></div><div class="review-metric"><span>评论</span><strong>${item.comments || '—'}</strong></div><div class="review-metric"><span>转发</span><strong>${item.shares || '—'}</strong></div><div class="review-metric"><span>互动率</span><strong>${engagement}</strong></div></div><div class="review-notes">${item.opening ? `<div class="review-note"><span>开头</span><p>${escapeHTML(item.opening)}</p></div>` : ''}${item.structure ? `<div class="review-note"><span>结构 / 节奏</span><p>${escapeHTML(item.structure)}</p></div>` : ''}${item.lesson ? `<div class="review-note"><span>下一次</span><p>${escapeHTML(item.lesson)}</p></div>` : ''}</div></article>`;
      }
      function renderEmpty(iconName, title, copy) {
        return `<div class="empty-state"><div class="empty-inner"><div class="empty-icon">${icon(iconName, 22)}</div><h3>${escapeHTML(title)}</h3><p>${escapeHTML(copy)}</p></div></div>`;
      }

      function renderView() {
        const root = document.getElementById('view-root');
        const renderers = { daily: renderDaily, ideas: renderIdeas, remix: renderRemix, review: renderReview, lifestyle: renderLifestyle };
        root.innerHTML = (renderers[currentView] || renderDaily)();
        updateIcons();
        bindViewEvents();
      }
      function renderAll() { updateHeader(); renderView(); }
      function setView(view) {
        currentView = view;
        if (view !== 'lifestyle') activeLifeSection = '';
        closeMobileMenu();
        renderAll();
      }
      const lifeSectionTargets = {
        water: { card: 'life-water-card', focus: 'life-water-custom' },
        meals: { card: 'life-meals-card', focus: 'life-breakfast' },
        exercise: { card: 'life-exercise-card', focus: 'life-exercise-done' },
        wellbeing: { card: 'life-wellbeing-card', focus: 'life-sleep-hours' }
      };
      function activateLifeSection(section) {
        const target = lifeSectionTargets[section];
        if (!target) return;
        activeLifeSection = section;
        currentView = 'lifestyle';
        closeMobileMenu();
        renderAll();
        requestAnimationFrame(() => {
          const card = document.getElementById(target.card);
          if (!card) return;
          const reducedMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
          const top = Math.max(0, window.scrollY + card.getBoundingClientRect().top - 112);
          window.scrollTo({ top, behavior: reducedMotion ? 'auto' : 'smooth' });
          document.getElementById(target.focus)?.focus({ preventScroll: true });
        });
      }
      function toggleLifeNav() {
        const toggle = document.getElementById('life-nav-toggle');
        const subnav = document.getElementById('life-subnav');
        if (!toggle || !subnav) return;
        const expanded = toggle.getAttribute('aria-expanded') === 'true';
        toggle.setAttribute('aria-expanded', String(!expanded));
        subnav.hidden = expanded;
      }

      function bindViewEvents() {
        document.querySelectorAll('[data-task-id]').forEach(input => input.addEventListener('change', event => {
          state.checks[`${state.selectedDate}:${event.target.dataset.taskId}`] = event.target.checked;
          persist();
          renderAll();
          showToast(event.target.checked ? '已记下这一项' : '已取消这一项');
        }));
        const mobilePlanDate = document.getElementById('mobile-plan-date');
        if (mobilePlanDate) mobilePlanDate.addEventListener('change', event => { state.selectedDate = event.target.value || today; persist(); renderAll(); });
        const dayNote = document.getElementById('day-note');
        if (dayNote) dayNote.addEventListener('input', event => { state.notes[state.selectedDate] = event.target.value; persist(); });
        const clear = document.getElementById('clear-checks');
        if (clear) clear.addEventListener('click', () => { TASKS.forEach(task => task.items.forEach(item => delete state.checks[`${state.selectedDate}:${item.id}`])); persist(); renderAll(); showToast('今日勾选已清空'); });
        const saveIdea = document.getElementById('save-idea');
        if (saveIdea) saveIdea.addEventListener('click', saveIdeaRecord);
        const saveRemix = document.getElementById('save-remix');
        if (saveRemix) saveRemix.addEventListener('click', saveRemixRecord);
        const saveReview = document.getElementById('save-review');
        if (saveReview) saveReview.addEventListener('click', saveReviewRecord);
        document.querySelectorAll('[data-water-add]').forEach(button => button.addEventListener('click', () => addWater(Number(button.dataset.waterAdd), button.id)));
        const addWaterButton = document.getElementById('add-water');
        if (addWaterButton) addWaterButton.addEventListener('click', addCustomWater);
        const waterInput = document.getElementById('life-water-custom');
        if (waterInput) waterInput.addEventListener('keydown', event => { if (event.key === 'Enter') addCustomWater(); });
        const resetWaterButton = document.getElementById('reset-water');
        if (resetWaterButton) resetWaterButton.addEventListener('click', resetWater);
        const saveMealsButton = document.getElementById('save-meals');
        if (saveMealsButton) saveMealsButton.addEventListener('click', saveMeals);
        const saveExerciseButton = document.getElementById('save-exercise');
        if (saveExerciseButton) saveExerciseButton.addEventListener('click', saveExercise);
        const saveWellbeingButton = document.getElementById('save-wellbeing');
        if (saveWellbeingButton) saveWellbeingButton.addEventListener('click', saveWellbeing);
        ['review-views','review-likes','review-comments','review-shares'].forEach(id => { const input = document.getElementById(id); if (input) input.addEventListener('input', updateReviewPreview); });
        document.querySelectorAll('.delete-record').forEach(button => button.addEventListener('click', () => deleteRecord(button.dataset.kind, button.dataset.id)));
        document.querySelectorAll('.record-status').forEach(select => select.addEventListener('change', event => updateStatus(event.target.dataset.kind, event.target.dataset.id, event.target.value)));
      }
      function value(id) { return document.getElementById(id)?.value.trim() || ''; }
      function safeExternalURL(value) {
        if (!value) return '';
        try {
          const url = new URL(value);
          return ['http:', 'https:'].includes(url.protocol) ? url.href : '';
        } catch (error) { return ''; }
      }
      function saveIdeaRecord() {
        const topic = value('idea-topic');
        if (!topic) { showToast('先写一个选题名称'); document.getElementById('idea-topic')?.focus(); return; }
        state.ideas.unshift({ id: uid('idea'), topic, hook: value('idea-hook'), angle: value('idea-angle'), evidence: value('idea-evidence'), format: document.getElementById('idea-format').value, status: '草稿', createdAt: today });
        persist(); renderAll(); showToast('选题已保存');
      }
      function saveRemixRecord() {
        const title = value('remix-title');
        if (!title) { showToast('先写视频标题或主题'); document.getElementById('remix-title')?.focus(); return; }
        state.remixes.unshift({ id: uid('remix'), title, source: value('remix-source'), platform: document.getElementById('remix-platform').value, reason: value('remix-reason'), structure: value('remix-structure'), angle: value('remix-angle'), status: '待拆解', createdAt: today });
        persist(); renderAll(); showToast('参考档案已保存');
      }
      function numberOrNull(id) { const raw = value(id); if (raw === '') return null; const number = Number(raw); return Number.isFinite(number) && number >= 0 ? number : null; }
      function saveReviewRecord() {
        const title = value('review-title');
        if (!title) { showToast('先写内容标题'); document.getElementById('review-title')?.focus(); return; }
        state.reviews.unshift({ id: uid('review'), title, views: numberOrNull('review-views'), likes: numberOrNull('review-likes'), comments: numberOrNull('review-comments'), shares: numberOrNull('review-shares'), opening: value('review-opening'), structure: value('review-structure'), lesson: value('review-lesson'), createdAt: today });
        persist(); renderAll(); showToast('复盘已保存');
      }
      function updateReviewPreview() {
        const views = numberOrNull('review-views');
        const likes = numberOrNull('review-likes') || 0;
        const comments = numberOrNull('review-comments') || 0;
        const shares = numberOrNull('review-shares') || 0;
        const rate = views ? `${((likes + comments + shares) / views * 100).toFixed(1)}%` : '—';
        document.getElementById('preview-engagement').textContent = rate;
        document.getElementById('preview-status').textContent = views ? '已填量级' : '待填';
      }
      function focusAfterRender(id) {
        if (!id) return;
        document.getElementById(id)?.focus({ preventScroll: true });
      }
      function commitLifeLog(date, log, message, focusId = '') {
        state.lifeLogs[date] = normalizeLifeLog(log);
        if (!persist()) return false;
        renderAll();
        focusAfterRender(focusId);
        showToast(message);
        return true;
      }
      function addWater(amount, focusId = '') {
        if (!Number.isInteger(amount) || amount < 1 || amount > 5000) { showToast('请输入 1–5000 的整数毫升数'); return; }
        const date = state.selectedDate;
        const log = getLifeLog(date);
        const previous = log.waterMl;
        log.waterMl = Math.min(50000, previous + amount);
        state.lifeLogs[date] = normalizeLifeLog(log);
        if (!persist()) return;
        renderAll();
        focusAfterRender(focusId);
        showToast(`已增加 ${amount} ml`, '撤销', () => {
          const current = getLifeLog(date);
          current.waterMl = previous;
          state.lifeLogs[date] = current;
          if (!persist()) return;
          renderAll();
          focusAfterRender(focusId);
          showToast('饮水记录已恢复');
        });
      }
      function addCustomWater() {
        const input = document.getElementById('life-water-custom');
        const amount = Number(input?.value);
        if (!input?.value || !Number.isInteger(amount) || amount < 1 || amount > 5000) {
          showToast('请输入 1–5000 的整数毫升数');
          input?.focus();
          return;
        }
        addWater(amount, 'life-water-custom');
      }
      function resetWater() {
        const date = state.selectedDate;
        const log = getLifeLog(date);
        const previous = log.waterMl;
        if (!previous) return;
        log.waterMl = 0;
        state.lifeLogs[date] = log;
        if (!persist()) return;
        renderAll();
        focusAfterRender('life-water-custom');
        showToast('当日饮水已清零', '撤销', () => {
          const current = getLifeLog(date);
          current.waterMl = previous;
          state.lifeLogs[date] = current;
          if (!persist()) return;
          renderAll();
          focusAfterRender('life-water-custom');
          showToast('饮水记录已恢复');
        });
      }
      function saveMeals() {
        const date = state.selectedDate;
        const log = getLifeLog(date);
        log.meals = {
          breakfast: value('life-breakfast'),
          lunch: value('life-lunch'),
          dinner: value('life-dinner'),
          snacks: value('life-snacks')
        };
        commitLifeLog(date, log, hasMealRecord(log) ? '饮食记录已保存' : '饮食记录已清空', 'save-meals');
      }
      function readBoundedNumber(id, max, message) {
        const input = document.getElementById(id);
        const raw = input?.value.trim() || '';
        if (!raw) return { valid: true, value: null };
        const number = Number(raw);
        if (!Number.isFinite(number) || number < 0 || number > max) {
          showToast(message);
          input?.focus();
          return { valid: false, value: null };
        }
        return { valid: true, value: number };
      }
      function saveExercise() {
        const minutes = readBoundedNumber('life-exercise-minutes', 1440, '运动时长请填写 0–1440 分钟');
        if (!minutes.valid) return;
        const date = state.selectedDate;
        const log = getLifeLog(date);
        log.exercise = {
          done: Boolean(document.getElementById('life-exercise-done')?.checked),
          type: value('life-exercise-type'),
          minutes: minutes.value,
          note: value('life-exercise-note')
        };
        commitLifeLog(date, log, hasExerciseRecord(log) ? '运动记录已保存' : '运动记录已清空', 'save-exercise');
      }
      function saveWellbeing() {
        const sleep = readBoundedNumber('life-sleep-hours', 24, '睡眠时长请填写 0–24 小时');
        if (!sleep.valid) return;
        const date = state.selectedDate;
        const log = getLifeLog(date);
        log.wellbeing = {
          sleepHours: sleep.value,
          mood: document.getElementById('life-mood')?.value || '',
          note: value('life-wellbeing-note')
        };
        commitLifeLog(date, log, hasWellbeingRecord(log) ? '身心状态已保存' : '身心状态已清空', 'save-wellbeing');
      }
      function deleteRecord(kind, id) {
        if (!Array.isArray(state[kind])) return;
        const index = state[kind].findIndex(item => item.id === id);
        if (index < 0) return;
        const [removed] = state[kind].splice(index, 1);
        if (!persist()) {
          state[kind].splice(index, 0, removed);
          renderAll();
          return;
        }
        renderAll();
        showToast('记录已删除', '撤销', () => {
          state[kind].splice(Math.min(index, state[kind].length), 0, removed);
          if (!persist()) {
            state[kind] = state[kind].filter(item => item !== removed);
            renderAll();
            return;
          }
          renderAll();
          showToast('记录已恢复');
        });
      }
      function updateStatus(kind, id, status) {
        const item = state[kind].find(record => record.id === id);
        if (item) { item.status = status; persist(); renderAll(); showToast('状态已更新'); }
      }

      function handleQuickAdd() {
        let targetId = currentView === 'daily' ? 'day-note' : currentView === 'ideas' ? 'idea-topic' : currentView === 'remix' ? 'remix-title' : currentView === 'review' ? 'review-title' : 'life-water-custom';
        if (currentView === 'lifestyle') {
          const log = getLifeLog();
          targetId = log.waterMl === 0 ? 'life-water-custom' : !hasMealRecord(log) ? 'life-breakfast' : !hasExerciseRecord(log) ? 'life-exercise-type' : 'life-sleep-hours';
        }
        const target = document.getElementById(targetId);
        if (target) {
          const reducedMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
          const top = Math.max(0, window.scrollY + target.getBoundingClientRect().top - 112);
          window.scrollTo({ top, behavior: reducedMotion ? 'auto' : 'smooth' });
          target.focus({ preventScroll: true });
        }
        if (currentView === 'daily') showToast('写下一句今日备注');
      }
      function buildSearchIndex() {
        const taskEntries = TASKS.flatMap(task => task.items.map(item => ({ view: 'daily', title: item.label, detail: `${task.title} · ${item.detail}` })));
        const ideaEntries = state.ideas.map(item => ({ view: 'ideas', title: item.topic, detail: item.angle || item.hook || '选题记录' }));
        const remixEntries = state.remixes.map(item => ({ view: 'remix', title: item.title, detail: item.reason || item.platform || '参考视频' }));
        const reviewEntries = state.reviews.map(item => ({ view: 'review', title: item.title, detail: item.lesson || item.opening || '内容复盘' }));
        const lifestyleEntries = [
          { view: 'lifestyle', section: 'water', title: '每日饮水', detail: '喝水 饮水量 水杯 ml' },
          { view: 'lifestyle', section: 'meals', title: '饮食记录', detail: '早餐 午餐 晚餐 加餐 零食' },
          { view: 'lifestyle', section: 'exercise', title: '运动打卡', detail: '散步 跑步 拉伸 运动时长' },
          { view: 'lifestyle', section: 'wellbeing', title: '睡眠与身心状态', detail: '睡眠 心情 精力 身体感受' }
        ];
        return [...taskEntries, ...lifestyleEntries, ...ideaEntries, ...remixEntries, ...reviewEntries];
      }
      function closeSearch() {
        const results = document.getElementById('search-results');
        results.hidden = true;
        results.innerHTML = '';
      }
      function renderSearchResults(query) {
        const results = document.getElementById('search-results');
        const normalized = query.trim().toLocaleLowerCase('zh-CN');
        if (!normalized) { closeSearch(); return; }
        const matches = buildSearchIndex().filter(item => `${item.title} ${item.detail}`.toLocaleLowerCase('zh-CN').includes(normalized)).slice(0, 8);
        results.innerHTML = matches.length
          ? matches.map(item => `<button class="search-result" type="button" role="option" data-search-view="${item.view}"${item.section ? ` data-search-section="${item.section}"` : ''}><span><strong>${escapeHTML(item.title)}</strong><span>${escapeHTML(item.detail)}</span></span><span>${escapeHTML(VIEW_META[item.view].label)}</span></button>`).join('')
          : '<div class="search-empty">没有匹配内容</div>';
        results.hidden = false;
      }
      function toggleSidebar() {
        document.body.classList.toggle('sidebar-collapsed');
        syncSidebarAccessibility();
      }

      function closeMobileMenu() {
        const sidebar = document.getElementById('sidebar');
        const scrim = document.getElementById('mobile-scrim');
        const menu = document.getElementById('mobile-menu');
        const wasOpen = sidebar.classList.contains('open');
        sidebar.classList.remove('open');
        scrim.classList.remove('open');
        scrim.setAttribute('aria-hidden', 'true');
        menu.setAttribute('aria-expanded', 'false');
        menu.setAttribute('aria-label', '打开工作区导航');
        syncSidebarAccessibility();
        if (wasOpen && mobileMedia.matches) menu.focus();
      }
      function toggleMobileMenu() {
        const sidebar = document.getElementById('sidebar');
        const scrim = document.getElementById('mobile-scrim');
        const menu = document.getElementById('mobile-menu');
        const open = !sidebar.classList.contains('open');
        sidebar.classList.toggle('open', open);
        scrim.classList.toggle('open', open);
        scrim.setAttribute('aria-hidden', String(!open));
        menu.setAttribute('aria-expanded', String(open));
        menu.setAttribute('aria-label', open ? '关闭工作区导航' : '打开工作区导航');
        syncSidebarAccessibility();
        if (open) sidebar.querySelector('.nav-item')?.focus();
      }
      document.getElementById('life-nav-toggle').addEventListener('click', toggleLifeNav);
      document.getElementById('primary-nav').addEventListener('click', event => {
        const sectionButton = event.target.closest('[data-life-section]');
        if (sectionButton) {
          activateLifeSection(sectionButton.dataset.lifeSection);
          return;
        }
        const button = event.target.closest('[data-view]');
        if (button) setView(button.dataset.view);
      });
      document.getElementById('mobile-menu').addEventListener('click', toggleMobileMenu);
      document.getElementById('mobile-scrim').addEventListener('click', closeMobileMenu);
      document.getElementById('quick-add').addEventListener('click', handleQuickAdd);
      document.getElementById('page-action').addEventListener('click', handleQuickAdd);
      document.getElementById('go-today').addEventListener('click', () => {
        state.selectedDate = today;
        persist();
        setView('daily');
        showToast('已回到今天');
      });
      document.getElementById('sidebar-toggle').addEventListener('click', toggleSidebar);
      document.getElementById('titlebar-toggle').addEventListener('click', toggleSidebar);
      document.getElementById('plan-date').addEventListener('change', event => { state.selectedDate = event.target.value || today; persist(); renderAll(); });
      const workspaceSearch = document.getElementById('workspace-search');
      workspaceSearch.addEventListener('input', event => renderSearchResults(event.target.value));
      document.getElementById('search-results').addEventListener('click', event => {
        const result = event.target.closest('[data-search-view]');
        if (!result) return;
        if (result.dataset.searchSection) activateLifeSection(result.dataset.searchSection);
        else setView(result.dataset.searchView);
        workspaceSearch.value = '';
        closeSearch();
      });
      document.addEventListener('click', event => { if (!event.target.closest('.global-search')) closeSearch(); });
      document.addEventListener('keydown', event => {
        if ((event.ctrlKey || event.metaKey) && event.key.toLowerCase() === 'k') {
          event.preventDefault();
          workspaceSearch.focus();
          workspaceSearch.select();
        }
        if (event.key === 'Escape') { closeMobileMenu(); closeSearch(); workspaceSearch.blur(); }
        if (event.key === 'Tab' && document.getElementById('sidebar').classList.contains('open') && window.matchMedia('(max-width: 820px)').matches) {
          const focusable = [...document.getElementById('sidebar').querySelectorAll('button:not([disabled]), input:not([disabled]), select:not([disabled]), textarea:not([disabled]), a[href]')];
          const first = focusable[0];
          const last = focusable[focusable.length - 1];
          if (event.shiftKey && document.activeElement === first) { event.preventDefault(); last?.focus(); }
          else if (!event.shiftKey && document.activeElement === last) { event.preventDefault(); first?.focus(); }
        }
      });
      const mobileMedia = window.matchMedia('(max-width: 820px)');
      const syncSidebarAccessibility = () => {
        const sidebar = document.getElementById('sidebar');
        const scrim = document.getElementById('mobile-scrim');
        const menu = document.getElementById('mobile-menu');
        const desktopToggles = [document.getElementById('titlebar-toggle'), document.getElementById('sidebar-toggle')];
        if (!mobileMedia.matches) {
          sidebar.classList.remove('open');
          scrim.classList.remove('open');
          scrim.setAttribute('aria-hidden', 'true');
          menu.setAttribute('aria-expanded', 'false');
        }
        const visible = mobileMedia.matches
          ? sidebar.classList.contains('open')
          : !document.body.classList.contains('sidebar-collapsed');
        sidebar.inert = !visible;
        sidebar.setAttribute('aria-hidden', String(!visible));
        desktopToggles.forEach(toggle => {
          toggle?.setAttribute('aria-expanded', String(visible));
          toggle?.setAttribute('aria-label', visible ? '收起侧栏' : '展开侧栏');
        });
      };
      mobileMedia.addEventListener?.('change', syncSidebarAccessibility);
      window.addEventListener('resize', syncSidebarAccessibility);
      syncSidebarAccessibility();
      updateStorageStatus();
      updateIcons();
      renderAll();
    })();
  </script>
</body>
</html>
