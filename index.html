<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f4f4f0">
  <title>个人成长工作台</title>
  <style>
    :root {
      --ink-green: #163f3a;
      --ink-green-deep: #0f302c;
      --ink: #1c2926;
      --muted: #68736d;
      --muted-light: #98a39c;
      --canvas: #f3f5f0;
      --paper: #ffffff;
      --line: #dfe5de;
      --line-strong: #cbd6cc;
      --coral: #e4664e;
      --coral-deep: #b94d3a;
      --yellow: #e7c45b;
      --yellow-soft: #fbf4d9;
      --mint: #d8eee0;
      --mint-deep: #2c7753;
      --lilac: #e9e5f5;
      --lilac-deep: #625890;
      --blue-soft: #e0edf1;
      --shadow: 0 18px 48px rgba(22, 63, 58, 0.10);
      --shadow-low: 0 8px 22px rgba(22, 63, 58, 0.08);
      --radius-panel: 12px;
      --radius-control: 8px;
      --ease: 180ms ease-out;
    }

    * { box-sizing: border-box; }
    html { background: var(--canvas); }
    body {
      margin: 0;
      min-width: 320px;
      min-height: 100vh;
      overflow-x: clip;
      color: var(--ink);
      background: var(--canvas);
      font-family: "Segoe UI", "Noto Sans SC", "Microsoft YaHei", sans-serif;
      font-size: 15px;
      line-height: 1.55;
      text-wrap: pretty;
    }
    button, input, textarea, select { font: inherit; }
    button { cursor: pointer; }
    button:focus-visible, input:focus-visible, textarea:focus-visible, select:focus-visible, a:focus-visible {
      outline: 3px solid rgba(228, 102, 78, 0.35);
      outline-offset: 2px;
    }
    a { color: inherit; }

    .app-shell { min-height: 100vh; display: grid; grid-template-columns: 252px minmax(0, 1fr); }
    .sidebar {
      position: sticky;
      top: 0;
      z-index: 30;
      height: 100vh;
      display: flex;
      flex-direction: column;
      padding: 24px 18px 18px;
      color: #f4f8f3;
      background: var(--ink-green);
      box-shadow: none;
      transition: transform var(--ease);
    }
    .brand-lockup { display: flex; align-items: center; gap: 12px; padding: 2px 9px 28px; }
    .brand-mark {
      display: grid;
      place-items: center;
      width: 36px;
      height: 36px;
      border: 1px solid rgba(255,255,255,0.23);
      border-radius: 9px;
      color: var(--ink-green);
      background: var(--yellow);
      font-weight: 800;
      letter-spacing: -0.04em;
    }
    .brand-name { font-size: 15px; font-weight: 760; letter-spacing: 0.015em; }
    .brand-caption { margin-top: 1px; color: rgba(244,248,243,0.62); font-size: 11px; }
    .nav-heading { margin: 0 10px 9px; color: rgba(244,248,243,0.48); font-size: 11px; font-weight: 700; letter-spacing: 0.12em; }
    .nav-list { display: grid; gap: 4px; }
    .nav-item {
      width: 100%;
      min-height: 46px;
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 0 12px;
      border: 1px solid transparent;
      border-radius: var(--radius-control);
      color: rgba(244,248,243,0.73);
      background: transparent;
      text-align: left;
      transition: color var(--ease), background var(--ease), border-color var(--ease), transform var(--ease);
    }
    .nav-item:hover { color: #fff; background: rgba(255,255,255,0.08); }
    .nav-item:active { transform: translateY(1px); }
    .nav-item.active { color: var(--ink-green); background: #f4f7f1; border-color: rgba(255,255,255,0.42); font-weight: 700; }
    .nav-item .nav-icon { width: 20px; height: 20px; flex: 0 0 20px; }
    .nav-item .nav-count { margin-left: auto; min-width: 22px; padding: 1px 6px; border-radius: 99px; color: var(--ink-green); background: var(--yellow); font-size: 11px; font-weight: 800; text-align: center; }
    .sidebar-spacer { flex: 1; }
    .sidebar-note {
      display: grid;
      gap: 9px;
      margin: 18px 2px 0;
      padding: 14px 13px;
      border-top: 1px solid rgba(255,255,255,0.14);
      color: rgba(244,248,243,0.67);
      font-size: 12px;
    }
    .local-status { display: inline-flex; align-items: center; gap: 7px; color: #d8eee0; font-weight: 650; }
    .status-dot { width: 7px; height: 7px; border-radius: 50%; background: #7fd29c; box-shadow: 0 0 0 4px rgba(127,210,156,0.14); }
    .sidebar-note p { margin: 0; line-height: 1.5; }

    .main { min-width: 0; }
    .mobile-bar { display: none; }
    .page { width: min(1440px, 100%); margin: 0 auto; padding: 30px 40px 68px; }
    .page-header {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 28px;
      margin-bottom: 28px;
      min-width: 0;
    }
    .breadcrumb { margin-bottom: 8px; color: var(--muted); font-size: 12px; font-weight: 700; letter-spacing: 0.05em; }
    h1, h2, h3, p { margin-top: 0; }
    h1 { margin-bottom: 8px; font-size: clamp(28px, 3vw, 42px); line-height: 1.12; letter-spacing: -0.035em; }
    .page-lede { max-width: 650px; margin-bottom: 0; color: var(--muted); font-size: 15px; }
    .header-actions { display: flex; align-items: center; gap: 10px; flex-shrink: 0; min-width: 0; }
    .date-chip {
      display: grid;
      gap: 1px;
      min-width: 132px;
      padding: 9px 13px;
      border: 1px solid var(--line-strong);
      border-radius: var(--radius-control);
      background: rgba(255,255,255,0.72);
    }
    .date-chip span { color: var(--muted); font-size: 11px; }
    .date-chip strong { font-size: 13px; }

    .button {
      min-height: 40px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      padding: 0 14px;
      border: 1px solid transparent;
      border-radius: var(--radius-control);
      font-weight: 700;
      transition: background var(--ease), border-color var(--ease), color var(--ease), transform var(--ease), box-shadow var(--ease);
    }
    .button:hover { transform: translateY(-1px); }
    .button:active { transform: translateY(0); }
    .button-primary { color: #fff; background: var(--coral); box-shadow: 0 5px 14px rgba(228,102,78,0.18); }
    .button-primary:hover { background: var(--coral-deep); }
    .button-secondary { color: var(--ink-green); border-color: var(--line-strong); background: var(--paper); }
    .button-secondary:hover { border-color: var(--ink-green); background: #f8faf7; }
    .button-quiet { color: var(--muted); background: transparent; border-color: transparent; }
    .button-quiet:hover { color: var(--ink); background: #e9eee8; }
    .button-danger { color: var(--coral-deep); background: transparent; border-color: transparent; }
    .button-danger:hover { background: #fff0ed; }
    .button svg { width: 17px; height: 17px; }

    .view { animation: view-in 180ms ease-out both; }
    @keyframes view-in { from { opacity: 0; transform: translateY(5px); } to { opacity: 1; transform: translateY(0); } }

    .overview-grid { display: grid; grid-template-columns: minmax(0, 1.3fr) minmax(300px, 0.7fr); gap: 16px; margin-bottom: 18px; }
    .panel {
      border: 1px solid var(--line);
      border-radius: var(--radius-panel);
      background: var(--paper);
      box-shadow: var(--shadow-low);
    }
    .panel-header { display: flex; align-items: flex-start; justify-content: space-between; gap: 16px; min-width: 0; padding: 20px 22px 0; }
    .panel-header > * { min-width: 0; }
    .panel-header h2, .panel-header h3 { margin-bottom: 5px; font-size: 18px; line-height: 1.25; letter-spacing: -0.02em; }
    .panel-header p { margin-bottom: 0; color: var(--muted); font-size: 13px; }
    .panel-body { padding: 18px 22px 22px; }
    .focus-panel { min-height: 214px; overflow: hidden; }
    .focus-kicker { display: inline-flex; align-items: center; gap: 7px; margin-bottom: 13px; color: var(--ink-green); font-size: 12px; font-weight: 800; }
    .focus-kicker .status-dot { background: var(--coral); box-shadow: 0 0 0 4px rgba(228,102,78,0.12); }
    .focus-line { max-width: 590px; margin-bottom: 20px; font-size: 22px; font-weight: 720; line-height: 1.3; letter-spacing: -0.025em; }
    .progress-row { display: flex; align-items: center; gap: 12px; max-width: 640px; }
    .progress-track { height: 8px; flex: 1; overflow: hidden; border-radius: 99px; background: #e5ebe4; }
    .progress-fill { width: 100%; height: 100%; border-radius: inherit; background: var(--coral); transform: scaleX(0); transform-origin: left center; transition: transform 240ms ease-out; }
    .progress-label { min-width: 78px; color: var(--muted); font-size: 12px; font-variant-numeric: tabular-nums; text-align: right; }
    .note-panel { min-height: 214px; background: var(--yellow-soft); border-color: #ead99a; box-shadow: none; }
    .note-panel .panel-header { padding-bottom: 0; }
    .note-panel .panel-body { display: flex; flex-direction: column; height: 150px; }
    .note-panel textarea { flex: 1; min-height: 78px; resize: none; border: 0; outline: 0; color: var(--ink); background: transparent; line-height: 1.6; }
    .note-panel textarea::placeholder { color: #9f8d52; }
    .note-save { align-self: flex-start; margin-top: 8px; color: #8a742e; font-size: 12px; }

    .section-heading { display: flex; align-items: flex-end; justify-content: space-between; gap: 16px; margin: 30px 0 13px; }
    .section-heading h2 { margin: 0; font-size: 22px; letter-spacing: -0.03em; }
    .section-heading p { margin: 4px 0 0; color: var(--muted); font-size: 13px; }
    .task-stack { display: grid; gap: 14px; }
    .task-panel { overflow: hidden; }
    .task-panel[data-tone="yellow"] { border-top: 3px solid var(--yellow); }
    .task-panel[data-tone="mint"] { border-top: 3px solid #7bc59a; }
    .task-panel[data-tone="lilac"] { border-top: 3px solid #9b91ce; }
    .task-header { display: flex; align-items: center; justify-content: space-between; gap: 14px; padding: 18px 22px 14px; border-bottom: 1px solid var(--line); }
    .task-heading { display: flex; align-items: baseline; flex-wrap: wrap; gap: 9px; }
    .task-heading h3 { margin: 0; font-size: 17px; letter-spacing: -0.02em; }
    .task-duration { color: var(--muted); font-size: 12px; }
    .task-count { color: var(--muted); font-size: 12px; font-variant-numeric: tabular-nums; }
    .task-intro { margin: 0; padding: 13px 22px 0; color: var(--muted); font-size: 13px; }
    .task-list { display: grid; gap: 0; margin: 0; padding: 8px 22px 12px; list-style: none; }
    .task-row { display: grid; grid-template-columns: 22px minmax(0, 1fr); gap: 11px; align-items: start; padding: 12px 0; border-bottom: 1px solid #edf0ec; }
    .task-row:last-child { border-bottom: 0; }
    .task-check { width: 19px; height: 19px; margin: 2px 0 0; accent-color: var(--coral); }
    .task-label { display: block; color: var(--ink); font-weight: 650; line-height: 1.45; cursor: pointer; }
    .task-detail { display: block; margin-top: 2px; color: var(--muted); font-size: 12px; line-height: 1.5; }
    .task-row.is-done .task-label { color: var(--muted); text-decoration: line-through; text-decoration-color: rgba(22,63,58,0.35); }
    .task-row.is-done .task-detail { color: var(--muted-light); }
    .daily-footer { display: flex; justify-content: flex-end; gap: 8px; margin-top: 14px; }
    #plan-date { width: 142px; max-width: 42vw; flex: 0 1 142px; }

    .workspace-intro { display: flex; align-items: flex-end; justify-content: space-between; gap: 18px; margin: 2px 0 18px; }
    .workspace-intro h2 { margin: 0; font-size: 21px; letter-spacing: -0.03em; }
    .workspace-intro p { max-width: 680px; margin: 6px 0 0; color: var(--muted); font-size: 13px; }
    .split-layout { display: grid; grid-template-columns: minmax(260px, 0.72fr) minmax(0, 1.28fr); gap: 16px; align-items: start; }
    .form-panel { position: sticky; top: 24px; }
    .form-panel .panel-body { display: grid; gap: 15px; }
    .field { display: grid; gap: 6px; }
    .field label { color: var(--ink); font-size: 12px; font-weight: 750; }
    .field small { color: var(--muted); font-size: 11px; }
    .field input, .field textarea, .field select {
      width: 100%;
      border: 1px solid var(--line-strong);
      border-radius: var(--radius-control);
      color: var(--ink);
      background: #fbfcfa;
      transition: border-color var(--ease), box-shadow var(--ease), background var(--ease);
    }
    .field input, .field select { height: 42px; padding: 0 11px; }
    .field textarea { min-height: 84px; padding: 10px 11px; resize: vertical; line-height: 1.5; }
    .field input:hover, .field textarea:hover, .field select:hover { border-color: #aebdb0; }
    .field input:focus, .field textarea:focus, .field select:focus { border-color: var(--ink-green); box-shadow: 0 0 0 3px rgba(22,63,58,0.10); outline: 0; background: #fff; }
    .form-actions { display: flex; justify-content: flex-end; gap: 8px; padding-top: 2px; }
    .capture-panel { min-height: 310px; }
    .capture-panel .panel-body { padding-top: 14px; }
    .empty-state { min-height: 270px; display: grid; place-items: center; padding: 32px; border: 1px dashed var(--line-strong); border-radius: 9px; background: #fbfcfa; text-align: center; }
    .empty-inner { max-width: 340px; }
    .empty-icon { display: grid; place-items: center; width: 46px; height: 46px; margin: 0 auto 13px; border: 1px solid var(--line); border-radius: 12px; color: var(--ink-green); background: var(--mint); }
    .empty-icon svg { width: 22px; height: 22px; }
    .empty-state h3 { margin-bottom: 7px; font-size: 17px; }
    .empty-state p { margin-bottom: 0; color: var(--muted); font-size: 13px; }
    .record-list { display: grid; gap: 10px; }
    .record {
      display: grid;
      gap: 11px;
      padding: 16px 17px;
      border: 1px solid var(--line);
      border-radius: 10px;
      background: #fff;
      transition: border-color var(--ease), box-shadow var(--ease), transform var(--ease);
    }
    .record:hover { border-color: #b6c5b8; box-shadow: var(--shadow-low); transform: translateY(-1px); }
    .record-top { display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; }
    .record-title { margin: 0; font-size: 16px; line-height: 1.35; }
    .record-meta { display: flex; flex-wrap: wrap; gap: 6px; color: var(--muted); font-size: 11px; }
    .tag { display: inline-flex; align-items: center; min-height: 24px; padding: 0 8px; border-radius: 99px; color: var(--ink-green); background: var(--mint); font-size: 11px; font-weight: 750; }
    .tag.yellow { background: var(--yellow-soft); color: #866d1f; }
    .tag.lilac { background: var(--lilac); color: var(--lilac-deep); }
    .record-content { display: grid; gap: 7px; color: var(--muted); font-size: 13px; }
    .record-content p { margin: 0; }
    .record-content strong { color: var(--ink); font-weight: 700; }
    .record-actions { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
    .record-actions select { height: 31px; padding: 0 7px; border: 1px solid var(--line); border-radius: 6px; color: var(--muted); background: #fbfcfa; font-size: 12px; }
    .icon-button { width: 34px; height: 34px; display: inline-grid; place-items: center; border: 1px solid transparent; border-radius: 7px; color: var(--muted); background: transparent; }
    .icon-button:hover { color: var(--coral-deep); border-color: #f1c5bc; background: #fff3f0; }
    .icon-button svg { width: 17px; height: 17px; }

    .review-layout { display: grid; grid-template-columns: minmax(280px, 0.8fr) minmax(0, 1.2fr); gap: 16px; align-items: start; }
    .review-form { background: var(--lilac); border-color: #d8d1ec; box-shadow: none; }
    .review-form .panel-body { display: grid; gap: 14px; }
    .metric-grid { display: grid; grid-template-columns: repeat(2, minmax(0,1fr)); gap: 10px; }
    .metric-preview { display: grid; grid-template-columns: repeat(2, 1fr); gap: 8px; margin-top: 2px; }
    .metric-cell { padding: 10px; border: 1px solid rgba(98,88,144,0.18); border-radius: 8px; background: rgba(255,255,255,0.58); }
    .metric-cell span { display: block; color: var(--lilac-deep); font-size: 11px; }
    .metric-cell strong { display: block; margin-top: 2px; font-size: 18px; font-variant-numeric: tabular-nums; }
    .review-list-panel { min-height: 380px; }
    .review-list-panel .panel-body { padding-top: 14px; }
    .review-record { padding: 15px 16px; }
    .review-metrics { display: flex; flex-wrap: wrap; gap: 12px; padding: 10px 0; border-top: 1px solid #edf0ec; border-bottom: 1px solid #edf0ec; }
    .review-metric span { display: block; color: var(--muted); font-size: 11px; }
    .review-metric strong { display: block; margin-top: 2px; font-size: 15px; font-variant-numeric: tabular-nums; }
    .review-notes { display: grid; grid-template-columns: repeat(3, minmax(0,1fr)); gap: 10px; }
    .review-note { min-width: 0; }
    .review-note span { display: block; margin-bottom: 3px; color: var(--muted); font-size: 11px; }
    .review-note p { margin: 0; color: var(--ink); font-size: 12px; line-height: 1.5; }

    .toast {
      position: fixed;
      right: 24px;
      bottom: 24px;
      z-index: 80;
      max-width: min(360px, calc(100vw - 32px));
      padding: 11px 14px;
      border: 1px solid rgba(22,63,58,0.18);
      border-radius: 8px;
      color: #fff;
      background: var(--ink-green);
      box-shadow: var(--shadow);
      font-size: 13px;
      opacity: 0;
      transform: translateY(8px);
      pointer-events: none;
      transition: opacity var(--ease), transform var(--ease);
    }
    .toast.show { opacity: 1; transform: translateY(0); pointer-events: auto; }
    .toast-action {
      margin-left: 10px;
      padding: 3px 8px;
      border: 1px solid rgba(255,255,255,0.45);
      border-radius: 4px;
      color: #fff;
      background: transparent;
      font-size: 12px;
      font-weight: 700;
    }
    .toast-action:hover { background: rgba(255,255,255,0.12); }
    .sidebar-note.storage-error .status-dot { background: #bb5b45; box-shadow: 0 0 0 4px rgba(187,91,69,0.12); }
    .sr-only { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0,0,0,0); white-space: nowrap; border: 0; }
    .mobile-scrim { display: none; }

    @media (max-width: 1080px) {
      .app-shell { grid-template-columns: 218px minmax(0,1fr); }
      .page { padding-inline: 28px; }
      .sidebar { padding-inline: 14px; }
      .brand-lockup { padding-inline: 6px; }
      .nav-item { padding-inline: 9px; }
    }
    @media (max-width: 820px) {
      .app-shell { display: block; }
      .sidebar { position: fixed; left: 0; top: 0; width: min(282px, 86vw); transform: translateX(-104%); }
      .sidebar.open { transform: translateX(0); }
      .mobile-scrim { position: fixed; inset: 0; z-index: 20; display: block; background: rgba(9, 28, 25, 0.42); opacity: 0; pointer-events: none; transition: opacity var(--ease); }
      .mobile-scrim.open { opacity: 1; pointer-events: auto; }
      .mobile-bar { position: sticky; top: 0; z-index: 15; height: 58px; display: flex; align-items: center; justify-content: space-between; padding: 0 16px; border-bottom: 1px solid var(--line); background: rgba(243,245,240,0.95); backdrop-filter: blur(9px); }
      .mobile-bar .mobile-brand { display: inline-flex; align-items: center; gap: 9px; color: var(--ink-green); font-weight: 800; }
      .mobile-brand .brand-mark { width: 29px; height: 29px; border-radius: 7px; font-size: 12px; }
      .mobile-menu { width: 38px; height: 38px; display: grid; place-items: center; border: 1px solid var(--line-strong); border-radius: 8px; color: var(--ink-green); background: var(--paper); }
      .mobile-menu svg { width: 19px; height: 19px; }
      .page { padding: 24px 18px 52px; }
      .overview-grid, .split-layout, .review-layout { grid-template-columns: 1fr; }
      .form-panel { position: static; }
      .page-header { margin-bottom: 22px; }
      .header-actions { align-items: flex-end; flex-direction: column; gap: 8px; }
      .date-chip { min-width: 118px; }
    }
    @media (max-width: 560px) {
      .page { padding-inline: 14px; }
      .page-header { display: block; }
      .header-actions { display: grid; grid-template-columns: minmax(0, 1fr) 110px; align-items: center; width: 100%; margin-top: 16px; }
      .header-actions .button { min-width: 0; min-height: 44px; padding-inline: 10px; }
      .date-chip { min-width: 0; width: 110px; padding-inline: 10px; }
      .mobile-menu { width: 44px; height: 44px; }
      h1 { font-size: 30px; }
      .focus-line { font-size: 19px; }
      .panel-header, .panel-body { padding-inline: 16px; }
      .task-header { padding-inline: 16px; }
      .task-intro { padding-inline: 16px; }
      .task-list { padding-inline: 16px; }
      .section-heading { display: block; }
      .daily-footer { justify-content: stretch; }
      .daily-footer .button { flex: 1; }
      .workspace-intro { display: block; }
      .review-notes { grid-template-columns: 1fr; }
      .metric-grid { grid-template-columns: 1fr; }
      .toast { right: 16px; bottom: 16px; }
    }
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { scroll-behavior: auto !important; animation-duration: 0.01ms !important; animation-iteration-count: 1 !important; transition-duration: 0.01ms !important; }
    }
  </style>
  <style id="workspace-reference-overhaul">
    :root {
      --ink-green: #255b4b;
      --ink-green-deep: #173f35;
      --ink: #171815;
      --muted: #66675f;
      --muted-light: #96978f;
      --canvas: #f7f7f3;
      --paper: #ffffff;
      --sidebar: #f1f1ed;
      --line: #dfdfd9;
      --line-strong: #cecec7;
      --coral: #111210;
      --coral-deep: #000000;
      --yellow: #ded6b6;
      --yellow-soft: #f3eedc;
      --mint: #e4eeea;
      --mint-deep: #2f6253;
      --lilac: #eeece8;
      --lilac-deep: #5e5c56;
      --blue-soft: #e9efed;
      --shadow: 0 18px 48px rgba(27, 28, 24, 0.12);
      --shadow-low: 0 1px 2px rgba(27, 28, 24, 0.05);
      --radius-panel: 8px;
      --radius-control: 6px;
      --ease: 180ms cubic-bezier(0.22, 1, 0.36, 1);
      --titlebar-height: 38px;
      --sidebar-width: 292px;
      --topbar-height: 74px;
    }

    html { background: var(--canvas); }
    body {
      color: var(--ink);
      background: var(--canvas);
      font-family: "Segoe UI Variable Text", "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
      font-size: 15px;
      line-height: 1.5;
      letter-spacing: 0;
    }
    h1, h2, h3, p, button, input, textarea, select { letter-spacing: 0; }
    button:focus-visible, input:focus-visible, textarea:focus-visible, select:focus-visible, a:focus-visible {
      outline: 2px solid #171815;
      outline-offset: 2px;
    }

    .app-titlebar {
      position: sticky;
      top: 0;
      z-index: 60;
      height: var(--titlebar-height);
      display: grid;
      place-items: center;
      border-bottom: 1px solid var(--line);
      background: rgba(249, 249, 247, 0.97);
      color: #2a2b27;
      font-size: 14px;
      font-weight: 700;
    }
    .titlebar-control {
      position: absolute;
      left: 14px;
      width: 54px;
      height: 28px;
      display: grid;
      place-items: center;
      border: 1px solid #c9c9c3;
      border-radius: 14px;
      color: #5f605a;
      background: #e7e7e3;
      transition: background var(--ease), color var(--ease);
    }
    .titlebar-control:hover { color: var(--ink); background: #ddddda; }
    .titlebar-control svg { width: 16px; height: 16px; }

    .app-shell {
      min-height: calc(100vh - var(--titlebar-height));
      grid-template-columns: var(--sidebar-width) minmax(0, 1fr);
      transition: grid-template-columns var(--ease);
    }
    body.sidebar-collapsed .app-shell { grid-template-columns: 0 minmax(0, 1fr); }
    body.sidebar-collapsed .sidebar { transform: translateX(-100%); pointer-events: none; }

    .sidebar {
      top: var(--titlebar-height);
      height: calc(100vh - var(--titlebar-height));
      padding: 18px 14px 16px;
      overflow-y: auto;
      color: var(--ink);
      background: var(--sidebar);
      border-right: 1px solid var(--line);
      box-shadow: none;
      scrollbar-width: thin;
      scrollbar-color: #b9b9b2 transparent;
    }
    .sidebar::-webkit-scrollbar { width: 7px; }
    .sidebar::-webkit-scrollbar-thumb { border-radius: 99px; background: #b9b9b2; }
    .brand-lockup {
      gap: 11px;
      padding: 2px 8px 17px;
      border-bottom: 1px solid var(--line);
    }
    .brand-mark {
      width: 36px;
      height: 36px;
      border: 1px solid #c8c8c2;
      border-radius: 7px;
      color: #363732;
      background: #e5e5e1;
      font-size: 12px;
      font-weight: 750;
    }
    .brand-name { color: var(--ink); font-size: 17px; font-weight: 700; }
    .brand-caption { color: #66675f; font-size: 11px; }
    .primary-nav { display: grid; gap: 20px; padding-top: 18px; }
    .nav-group { display: grid; gap: 6px; }
    .nav-heading {
      margin: 0 10px 4px;
      color: #777870;
      font-size: 11px;
      font-weight: 650;
      letter-spacing: 0;
    }
    .nav-group-toggle {
      width: 100%;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      padding: 0 10px 4px;
      border: 0;
      color: #777870;
      background: transparent;
      text-align: left;
      cursor: pointer;
    }
    .nav-group-toggle:hover { color: var(--ink); }
    .nav-group-toggle .nav-chevron {
      width: 14px;
      height: 14px;
      flex: 0 0 14px;
      transition: transform var(--ease), color var(--ease);
    }
    .nav-group-toggle[aria-expanded="false"] .nav-chevron { transform: rotate(-90deg); }
    .nav-list { display: grid; gap: 3px; }
    .nav-item {
      min-height: 44px;
      gap: 12px;
      padding: 0 11px;
      border-radius: 6px;
      color: #292a26;
      font-size: 15px;
      font-weight: 500;
    }
    .nav-item:hover { color: var(--ink); background: #e7e7e2; }
    .nav-item.active {
      color: var(--ink);
      background: #ffffff;
      border-color: #d7d7d1;
      box-shadow: 0 1px 2px rgba(20, 20, 18, 0.05);
      font-weight: 650;
    }
    .nav-item .nav-icon { width: 20px; height: 20px; color: #242521; }
    .nav-item .nav-count {
      min-width: 24px;
      min-height: 24px;
      display: inline-grid;
      place-items: center;
      padding: 0 6px;
      border-radius: 12px;
      color: #5e5f58;
      background: #fafaf8;
      font-size: 11px;
      font-weight: 700;
    }
    .nav-sublist {
      display: grid;
      gap: 2px;
      margin: 1px 0 3px 32px;
      padding-left: 11px;
      border-left: 1px solid #d5d5cf;
    }
    .nav-subitem {
      min-height: 34px;
      display: flex;
      align-items: center;
      gap: 9px;
      padding: 0 9px;
      border: 1px solid transparent;
      border-radius: 5px;
      color: #777870;
      background: transparent;
      font-size: 12px;
      font-weight: 550;
      text-align: left;
      transition: color var(--ease), background var(--ease), border-color var(--ease);
    }
    .nav-subitem:hover { color: var(--ink); background: #e7e7e2; }
    .nav-subitem.active {
      color: #255b4b;
      background: #e4eeea;
      border-color: #d2e2da;
      font-weight: 700;
    }
    .nav-subitem .nav-subicon { width: 15px; height: 15px; flex: 0 0 15px; color: currentColor; }
    .nav-subitem .nav-subicon svg { width: 15px; height: 15px; }
    .sidebar-note {
      gap: 7px;
      margin: 20px 5px 0;
      padding: 15px 7px 0;
      border-top-color: var(--line);
      color: #777870;
      font-size: 11px;
    }
    .local-status { color: #49675d; font-weight: 650; }
    .status-dot { background: #4a7868; box-shadow: none; }

    .main { min-width: 0; background: var(--canvas); }
    .desktop-topbar {
      position: sticky;
      top: var(--titlebar-height);
      z-index: 25;
      height: var(--topbar-height);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 24px;
      padding: 0 34px;
      border-bottom: 1px solid var(--line);
      background: rgba(248, 248, 245, 0.96);
      backdrop-filter: blur(12px);
    }
    .topbar-date { position: relative; color: #4f504a; font-size: 14px; font-weight: 550; white-space: nowrap; }
    .topbar-date #plan-date { position: absolute; inset: 0; width: 100%; height: 100%; opacity: 0; cursor: pointer; }
    .topbar-tools { display: flex; align-items: center; gap: 10px; min-width: 0; }
    .global-search { position: relative; width: min(270px, 28vw); }
    .search-shell {
      height: 44px;
      display: grid;
      grid-template-columns: 20px minmax(0, 1fr) auto;
      align-items: center;
      gap: 8px;
      padding: 0 10px 0 13px;
      border: 1px solid #d4d4ce;
      border-radius: 7px;
      background: #ffffff;
      box-shadow: var(--shadow-low);
    }
    .search-shell:focus-within { border-color: #8b8c85; box-shadow: 0 0 0 2px rgba(23, 24, 21, 0.08); }
    .search-shell svg { color: #66675f; }
    .search-shell input {
      width: 100%;
      min-width: 0;
      border: 0;
      outline: 0;
      color: var(--ink);
      background: transparent;
      font-size: 14px;
    }
    .search-shell input::placeholder { color: #777870; opacity: 1; }
    .search-shell kbd {
      padding: 2px 6px;
      border: 1px solid #d3d3cd;
      border-radius: 4px;
      color: #686962;
      background: #f6f6f3;
      font-family: inherit;
      font-size: 11px;
      box-shadow: 0 1px 0 #e3e3de;
    }
    .search-results {
      position: absolute;
      top: calc(100% + 8px);
      left: 0;
      right: 0;
      z-index: 90;
      max-height: 360px;
      overflow-y: auto;
      padding: 6px;
      border: 1px solid #d3d3cd;
      border-radius: 8px;
      background: #ffffff;
      box-shadow: 0 18px 42px rgba(26, 26, 23, 0.14);
    }
    .search-results[hidden] { display: none; }
    .search-result {
      width: 100%;
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      gap: 10px;
      padding: 10px;
      border: 0;
      border-radius: 5px;
      color: var(--ink);
      background: transparent;
      text-align: left;
    }
    .search-result:hover, .search-result:focus-visible { background: #f1f1ed; }
    .search-result strong { display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: 13px; }
    .search-result span { color: #777870; font-size: 11px; }
    .search-empty { padding: 18px 12px; color: #777870; font-size: 12px; text-align: center; }
    .topbar-icon {
      width: 44px;
      height: 44px;
      display: grid;
      place-items: center;
      border: 1px solid #d7d7d1;
      border-radius: 7px;
      color: #242521;
      background: #ffffff;
    }
    .topbar-icon:hover { background: #eeeeea; border-color: #c6c6c0; }
    .avatar {
      width: 44px;
      height: 44px;
      display: grid;
      place-items: center;
      border-radius: 50%;
      color: #ffffff;
      background: #111210;
      font-size: 13px;
      font-weight: 750;
    }

    .page { width: min(1120px, 100%); padding: 42px 40px 72px; }
    .page-header { align-items: flex-end; margin-bottom: 24px; }
    .breadcrumb { margin-bottom: 9px; color: #5f6059; font-size: 12px; font-weight: 600; letter-spacing: 0; }
    h1 { margin-bottom: 8px; font-size: 38px; line-height: 1.16; letter-spacing: 0; }
    .page-lede { max-width: 690px; color: #66675f; font-size: 14px; }
    .header-actions { align-items: center; }
    .button {
      min-height: 44px;
      padding: 0 15px;
      border-radius: 7px;
      font-size: 14px;
      font-weight: 650;
      box-shadow: none;
    }
    .button:hover { transform: none; }
    .button:active { transform: translateY(1px); }
    .button-primary { color: #ffffff; background: #111210; border-color: #111210; box-shadow: none; }
    .button-primary:hover { background: #2a2b27; border-color: #2a2b27; }
    .button-secondary { color: var(--ink); border-color: #d1d1ca; background: #ffffff; }
    .button-secondary:hover { border-color: #a9aaa3; background: #f7f7f3; }
    .button-quiet:hover { color: var(--ink); background: #ecece7; }
    .view { animation: view-in var(--ease) both; }
    @keyframes view-in { from { opacity: 0; clip-path: inset(0 0 8px 0); } to { opacity: 1; clip-path: inset(0); } }

    .panel {
      border-color: #d8d8d2;
      border-radius: 8px;
      box-shadow: none;
    }
    .panel-header { padding: 21px 22px 0; }
    .panel-header h2, .panel-header h3 { font-size: 17px; line-height: 1.3; letter-spacing: 0; }
    .panel-header p { color: #6d6e67; font-size: 12px; }
    .panel-body { padding: 17px 22px 22px; }

    .daily-toolbar {
      display: none;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      margin-bottom: 18px;
    }
    .daily-summary { display: flex; align-items: baseline; gap: 9px; color: #66675f; font-size: 13px; }
    .daily-summary strong { color: var(--ink); font-size: 18px; font-variant-numeric: tabular-nums; }
    #mobile-plan-date {
      width: 146px;
      height: 38px;
      max-width: none;
      padding: 0 9px;
      border: 1px solid #d2d2cc;
      border-radius: 6px;
      color: #454641;
      background: #ffffff;
      font-size: 12px;
    }
    .task-stack { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 22px; align-items: start; }
    .task-panel {
      position: relative;
      display: flex;
      flex-direction: column;
      min-height: 330px;
      padding: 24px 26px 22px;
      overflow: hidden;
    }
    .task-panel[data-tone] { border-top: 1px solid #d8d8d2; }
    .task-card-top { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 11px; }
    .task-heading { display: block; }
    .task-heading h3 { margin: 0; font-size: 21px; line-height: 1.3; }
    .task-duration { display: inline-flex; margin-top: 3px; color: #65665f; font-size: 13px; }
    .task-intro { margin: 2px 0 13px; padding: 0; color: #66675f; font-size: 13px; }
    .task-list { flex: 1; gap: 0; padding: 0; }
    .task-row { grid-template-columns: 20px minmax(0, 1fr); gap: 10px; padding: 10px 0; border-bottom-color: #ecece7; }
    .task-check { width: 17px; height: 17px; margin-top: 2px; accent-color: #255b4b; }
    .task-label { color: #292a26; font-size: 13px; font-weight: 600; }
    .task-detail { color: #777870; font-size: 11px; }
    .task-row.is-done .task-label { color: #777870; text-decoration-color: #8d8e87; }
    .task-progress { margin-top: 15px; padding-top: 14px; border-top: 1px solid #ededE8; }
    .task-progress-track { height: 7px; overflow: hidden; border-radius: 4px; background: #f0f0ec; }
    .task-progress-fill { width: 100%; height: 100%; border-radius: inherit; background: #285b4c; transform-origin: left center; transition: transform 240ms var(--ease); }
    .task-progress-meta { display: flex; align-items: center; justify-content: space-between; margin-top: 9px; color: #65665f; font-size: 11px; }
    .task-progress-meta strong { color: #4a4b45; font-size: 12px; font-variant-numeric: tabular-nums; }
    .tag {
      min-height: 23px;
      padding: 0 8px;
      border-radius: 5px;
      color: #365f53;
      background: #e5eeea;
      font-size: 11px;
      font-weight: 650;
    }
    .tag.yellow { color: #6e623c; background: #f2eddd; }
    .tag.lilac { color: #5f5d57; background: #efeeea; }
    .tag.status-done { color: #365f53; background: #dfece7; }
    .tag.status-active { color: #605a43; background: #eee9d8; }
    .tag.status-idle { color: #6a6b65; background: #eeeeea; }
    .daily-note { margin-top: 22px; }
    .daily-note .panel-body { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 16px; align-items: end; }
    .daily-note textarea { min-height: 74px; resize: vertical; }
    .note-save { color: #777870; white-space: nowrap; }
    .daily-footer { margin-top: 12px; }

    .workspace-intro { align-items: center; margin: 0 0 18px; }
    .workspace-intro h2 { font-size: 18px; letter-spacing: 0; }
    .workspace-intro p { max-width: 620px; color: #6b6c65; font-size: 12px; }
    .split-layout { grid-template-columns: minmax(300px, 0.74fr) minmax(0, 1.26fr); gap: 22px; }
    .form-panel { top: calc(var(--titlebar-height) + var(--topbar-height) + 18px); }
    .form-panel .panel-body, .review-form .panel-body { gap: 14px; }
    .field { gap: 6px; }
    .field label { color: #3d3e39; font-size: 12px; font-weight: 650; }
    .field input, .field textarea, .field select {
      border-color: #d2d2cc;
      border-radius: 6px;
      color: var(--ink);
      background: #fbfbf9;
    }
    .field input, .field select { height: 42px; }
    .field input:hover, .field textarea:hover, .field select:hover { border-color: #ababA4; }
    .field input:focus, .field textarea:focus, .field select:focus { border-color: #6f7069; box-shadow: 0 0 0 2px rgba(23, 24, 21, 0.08); background: #ffffff; }
    .empty-state { border-style: solid; border-color: #e3e3dd; border-radius: 7px; background: #fafaf8; }
    .empty-icon { border-radius: 7px; color: #4f665e; background: #e9efec; }
    .record-list { gap: 12px; }
    .record { border-color: #deded8; border-radius: 7px; box-shadow: none; }
    .record:hover { border-color: #bdbdb6; box-shadow: 0 2px 8px rgba(27, 28, 24, 0.06); transform: none; }
    .record-title { font-size: 15px; }
    .record-content { color: #66675f; }
    .record-actions select { border-color: #d5d5cf; background: #fafaf8; }
    .icon-button { width: 38px; height: 38px; border-radius: 6px; }
    .icon-button:hover { color: #8a3434; border-color: #e4caca; background: #fbf2f2; }
    .review-layout { grid-template-columns: minmax(320px, 0.82fr) minmax(0, 1.18fr); gap: 22px; }
    .review-form { background: #ffffff; border-color: #d8d8d2; }
    .metric-cell { border-color: #deded8; border-radius: 6px; background: #f7f7f4; }
    .metric-cell span { color: #676861; }

    .life-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 22px;
      align-items: start;
    }
    .life-card { min-width: 0; }
    .life-card .panel-header { align-items: center; }
    .life-card .panel-body { display: grid; gap: 15px; }
    .life-card .field textarea { min-height: 72px; }
    .life-total {
      display: flex;
      align-items: flex-end;
      justify-content: space-between;
      gap: 16px;
      padding: 14px 0 16px;
      border-bottom: 1px solid #ecece7;
    }
    .life-total span { display: block; color: #6a6b64; font-size: 12px; }
    .life-total strong { display: flex; align-items: baseline; gap: 6px; margin-top: 2px; font-size: 30px; line-height: 1; font-variant-numeric: tabular-nums; }
    .life-total small { color: #686961; font-size: 12px; font-weight: 600; }
    .life-total-note { max-width: 190px; margin: 0; color: #777870; font-size: 11px; text-align: right; }
    .water-quick { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
    .water-quick .button { min-width: 0; padding-inline: 8px; }
    .life-form-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
    .life-form-grid .span-all { grid-column: 1 / -1; }
    .life-check {
      min-height: 46px;
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 0 12px;
      border: 1px solid #d2d2cc;
      border-radius: 6px;
      color: #343530;
      background: #fbfbf9;
      font-size: 13px;
      font-weight: 650;
      cursor: pointer;
    }
    .life-check:hover { border-color: #ababA4; }
    .life-check input { width: 18px; height: 18px; margin: 0; accent-color: #255b4b; }
    .life-actions { display: flex; align-items: center; justify-content: flex-end; gap: 8px; }
    .life-actions.split { justify-content: space-between; }
    .life-saved {
      display: grid;
      gap: 8px;
      padding: 12px 13px;
      border: 1px solid #e2e2dc;
      border-radius: 6px;
      background: #f8f8f5;
    }
    .life-saved-row { display: grid; grid-template-columns: 68px minmax(0, 1fr); gap: 10px; font-size: 12px; }
    .life-saved-row span { color: #777870; }
    .life-saved-row strong { color: #363732; font-weight: 600; overflow-wrap: anywhere; }
    .life-caption { margin: 0; color: #777870; font-size: 11px; line-height: 1.55; }
    .button:disabled { opacity: 0.45; cursor: not-allowed; transform: none; }

    .toast { border-color: #111210; border-radius: 6px; color: #ffffff; background: #111210; }

    @media (max-width: 1160px) {
      :root { --sidebar-width: 258px; }

      .page { padding-inline: 28px; }
      .global-search { width: 230px; }
      .topbar-icon:nth-of-type(2) { display: none; }
    }
    @media (max-width: 920px) {
      .global-search { width: 205px; }
      .search-shell kbd { display: none; }
      #sidebar-toggle { display: none; }
      .task-stack { gap: 16px; }
    }
    @media (max-width: 820px) {
      :root { --titlebar-height: 0px; }
      .app-titlebar, .desktop-topbar { display: none; }
      .app-shell { min-height: 100vh; display: block; }
      body.sidebar-collapsed .app-shell { display: block; }
      .sidebar {
        position: fixed;
        top: 0;
        left: 0;
        width: min(292px, 88vw);
        height: 100vh;
        transform: translateX(-104%);
        pointer-events: auto;
        box-shadow: 18px 0 48px rgba(27, 28, 24, 0.14);
      }
      body.sidebar-collapsed .sidebar { transform: translateX(-104%); pointer-events: auto; }
      .sidebar.open, body.sidebar-collapsed .sidebar.open { transform: translateX(0); }
      .mobile-scrim { background: rgba(26, 27, 24, 0.28); }
      .mobile-bar {
        height: 58px;
        background: rgba(248, 248, 245, 0.97);
        border-bottom-color: var(--line);
        backdrop-filter: blur(10px);
      }
      .mobile-bar .mobile-brand { color: var(--ink); font-weight: 700; }
      .mobile-brand .brand-mark { color: #363732; background: #e5e5e1; }
      .mobile-menu { width: 44px; height: 44px; color: var(--ink); background: #ffffff; border-color: #d3d3cd; }
      .page { padding: 28px 18px 52px; }
      .page-header { align-items: flex-start; }

      .task-stack, .overview-grid, .split-layout, .review-layout, .life-grid { grid-template-columns: 1fr; }
      .form-panel { position: static; }

      .lifestyle-view .workspace-intro .tag { display: none; }
    }
    @media (max-width: 560px) {
      .page { padding-inline: 14px; }

        document.querySelectorAll('[data-icon]').forEach(node => { node.innerHTML = icon(node.dataset.icon, node.classList.contains('nav-icon') ? 19 : 18); });

      function updateHeader() {
        const meta = VIEW_META[currentView];
        document.getElementById('breadcrumb').textContent = meta.kicker;
        document.getElementById('page-title').textContent = meta.label;
        document.getElementById('page-lede').textContent = meta.lede;
        document.getElementById('header-date').textContent = formatDate(state.selectedDate);
        document.getElementById('plan-date').value = state.selectedDate;
        document.getElementById('page-action-label').textContent = meta.action;
        document.querySelectorAll('.nav-item').forEach(button => button.classList.toggle('active', button.dataset.view === currentView));
        document.querySelectorAll('.nav-subitem').forEach(button => button.classList.toggle('active', currentView === 'lifestyle' && button.dataset.lifeSection === activeLifeSection));

      function renderDaily() {
        const done = completedCount();
        const total = totalCount();
        return `<div class="view daily-view">
          <div class="daily-toolbar">
            <div class="daily-summary"><strong>${done}/${total}</strong><span>项今日任务已完成</span></div>
            <div><label class="sr-only" for="mobile-plan-date">选择计划日期</label><input id="mobile-plan-date" type="date" value="${escapeHTML(state.selectedDate)}"></div>
          </div>
          <div class="task-stack">${TASKS.map(renderTask).join('')}</div>
          <section class="panel daily-note" aria-labelledby="note-title"><div class="panel-header"><div><h2 id="note-title">今日备注</h2><p>给晚上的自己留一句真实记录</p></div><span data-icon="note" aria-hidden="true"></span></div><div class="panel-body"><div class="field"><label class="sr-only" for="day-note">今日备注</label><textarea id="day-note" placeholder="例如：今天先做资料分析和判断推理……">${escapeHTML(state.notes[state.selectedDate] || '')}</textarea></div><span class="note-save">${formatDateTag(state.selectedDate)} · 自动保存在本机</span></div></section>
          <div class="daily-footer"><button class="button button-quiet" id="clear-checks" type="button">${icon('refresh', 16)}清空今日勾选</button></div>

      function renderTask(task) {
        const done = task.items.filter(item => state.checks[`${state.selectedDate}:${item.id}`]).length;
        const percent = task.items.length ? Math.round(done / task.items.length * 100) : 0;
        const category = task.id === 'morning' ? '积累目标' : task.id === 'aptitude' ? '核心目标' : '表达目标';
        const status = percent === 100 ? '已完成' : done > 0 ? '进行中' : '待开始';
        const statusClass = percent === 100 ? 'status-done' : done > 0 ? 'status-active' : 'status-idle';
        return `<section class="panel task-panel" data-tone="${task.tone}" aria-labelledby="task-${task.id}"><div class="task-card-top"><span class="tag">${category}</span><span class="tag ${statusClass}">${status}</span></div><div class="task-heading"><h3 id="task-${task.id}">${escapeHTML(task.title)}</h3><span class="task-duration">${escapeHTML(task.duration)}</span></div><p class="task-intro">${escapeHTML(task.intro)}</p><ul class="task-list">${task.items.map(item => { const checked = Boolean(state.checks[`${state.selectedDate}:${item.id}`]); return `<li class="task-row ${checked ? 'is-done' : ''}"><input class="task-check" id="check-${item.id}" type="checkbox" data-task-id="${item.id}" ${checked ? 'checked' : ''}><div><label class="task-label" for="check-${item.id}">${escapeHTML(item.label)}</label><span class="task-detail">${escapeHTML(item.detail)}</span></div></li>`; }).join('')}</ul><div class="task-progress"><div class="task-progress-track" aria-label="${escapeHTML(task.title)}完成进度"><div class="task-progress-fill" style="transform:scaleX(${percent / 100})"></div></div><div class="task-progress-meta"><span>当前进度</span><strong>${percent}%</strong></div></div></section>`;
      }

                <div class="life-actions split"><button class="button button-quiet" id="reset-water" type="button" ${log.waterMl === 0 ? 'disabled' : ''}>清零</button><button class="button button-primary" id="add-water" type="button">${icon('plus', 16)}添加饮水</button></div>

            <section class="panel life-card" id="life-meals-card" aria-labelledby="life-meals-title">

            <section class="panel life-card" id="life-wellbeing-card" aria-labelledby="life-wellbeing-title">

                  <div class="field span-all"><label for="life-wellbeing-note">给身体的一句话 <small>可选</small></label><textarea id="life-wellbeing-note" rows="2" placeholder="例如：下午有点疲惫，今晚早点休息">${escapeHTML(log.wellbeing.note)}</textarea></div>
                </div>
